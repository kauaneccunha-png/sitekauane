<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guia Visual de Redes para Automação v2</title>
    <style>
        :root {
            --primary-blue: #1A365D;
            --primary-hover: #2A4365;
            --accent-orange: #DD6B20;
            --bg-factory: #F7FAFC;
            --card-white: #FFFFFF;
            --text-dark: #2D3748;
            --text-muted: #718096;
            --green-success: #38A169;
            --red-danger: #E53E3E;
            --radius: 12px;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        /* Variáveis para o Modo Escuro */
        [data-theme="dark"] {
            --bg-factory: #1A202C;
            --card-white: #2D3748;
            --text-dark: #EDF2F7;
            --text-muted: #A0AEC0;
            --primary-blue: #2B6CB0;
            --primary-hover: #4299E1;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            transition: background-color 0.3s, border-color 0.3s;
        }

        body {
            background-color: var(--bg-factory);
            color: var(--text-dark);
            line-height: 1.6;
            padding: 30px 20px;
        }

        /* Top Bar com seletor de tema */
        .top-bar {
            max-width: 900px;
            margin: 0 auto 10px auto;
            display: flex;
            justify-content: flex-end;
        }

        .theme-toggle {
            background: none;
            border: 2px solid var(--text-muted);
            color: var(--text-dark);
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
        }

        .theme-toggle:hover {
            border-color: var(--accent-orange);
            color: var(--accent-orange);
        }

        header {
            text-align: center;
            max-width: 900px;
            margin: 0 auto 35px auto;
            padding: 35px;
            background: linear-gradient(135deg, #1A365D, #2B6CB0);
            color: white;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            position: relative;
            overflow: hidden;
        }

        header h1 {
            font-size: 2.4rem;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
            position: relative;
            z-index: 2;
        }

        header p {
            font-weight: 300;
            opacity: 0.9;
            font-size: 1.1rem;
            position: relative;
            z-index: 2;
        }

        /* Elemento decorativo de ondas de rede no header */
        header::after {
            content: "📶";
            position: absolute;
            right: -20px;
            bottom: -20px;
            font-size: 10rem;
            opacity: 0.08;
            transform: rotate(-15deg);
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .tabs-nav {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .tab-btn {
            padding: 12px 28px;
            font-size: 1.05rem;
            font-weight: 600;
            background-color: #E2E8F0;
            color: #1A365D;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s;
        }

        body[data-theme="dark"] .tab-btn {
            background-color: #4A5568;
            color: #E2E8F0;
        }

        .tab-btn:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }

        .tab-btn.active {
            background-color: var(--accent-orange);
            color: white;
            box-shadow: 0 4px 12px rgba(221, 107, 32, 0.4);
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.4s ease forwards;
        }

        .tab-content.active {
            display: block;
        }

        /* Grid de Cards */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background-color: var(--card-white);
            padding: 25px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            cursor: pointer;
            text-align: center;
            border: 2px solid transparent;
            position: relative;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        .card.selected {
            border-color: var(--accent-orange);
            background-color: rgba(221, 107, 32, 0.03);
            box-shadow: 0 0 15px rgba(221, 107, 32, 0.15);
        }

        .card h3 {
            color: var(--primary-blue);
            font-size: 1.3rem;
            margin-bottom: 10px;
        }

        .card .icon {
            font-size: 2rem;
            margin-bottom: 10px;
            display: inline-block;
        }

        /* Botões de Ação */
        .buttons-group {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .action-btn {
            padding: 15px 30px;
            font-size: 1rem;
            font-weight: 600;
            background-color: var(--primary-blue);
            color: white;
            border: none;
            border-radius: var(--radius);
            cursor: pointer;
            box-shadow: var(--shadow);
            border: 2px solid transparent;
        }

        .action-btn:hover {
            background-color: var(--primary-hover);
            transform: scale(1.02);
        }

        .action-btn.selected {
            border-color: var(--accent-orange);
            background-color: var(--accent-orange);
            box-shadow: 0 4px 12px rgba(221, 107, 32, 0.3);
        }

        /* Painel de Informações */
        .info-panel {
            background-color: var(--card-white);
            padding: 30px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border-left: 6px solid var(--primary-blue);
            animation: fadeIn 0.3s ease;
        }

        .info-panel h2 {
            color: var(--primary-blue);
            margin-bottom: 12px;
            font-size: 1.5rem;
        }

        /* Gráfico Animado de Sinal (Live Telemetry Simulation) */
        .live-signal {
            margin-top: 15px;
            background: #1A202C;
            padding: 12px;
            border-radius: 8px;
            color: #48BB78;
            font-family: monospace;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.9rem;
        }

        .pulse-dot {
            width: 10px;
            height: 10px;
            background-color: #48BB78;
            border-radius: 50%;
            display: inline-block;
            animation: pulse 1.5s infinite;
        }
